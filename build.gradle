apply plugin: 'groovy'

def componentNode = parseComponent(project)
version = componentNode.'@version'
def jarBaseName = componentNode.'@name'
def moquiDir = projectDir.parentFile.parentFile.parentFile
def frameworkDir = file(moquiDir.absolutePath + '/framework')
def runtimeDir = projectDir.parentFile.parentFile

repositories {
    flatDir name: 'localLib', dirs: frameworkDir.absolutePath + '/lib'
    mavenCentral()
}

// Log4J has annotation processors, disable to avoid warning
tasks.withType(JavaCompile) { options.compilerArgs << "-proc:none" }
tasks.withType(GroovyCompile) { options.compilerArgs << "-proc:none" }

dependencies {
    implementation project(':framework')

    // Apache Commons JEXL - Apache 2.0 - https://commons.apache.org/proper/commons-jexl/
    // commons-logging is excluded: the framework already supplies it
    implementation('org.apache.commons:commons-jexl3:3.7.1') { exclude group: 'commons-logging' }

    // Spock + JUnit Platform, the framework's own versions (framework/build.gradle)
    testImplementation 'org.junit.platform:junit-platform-launcher:6.0.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.0.1'
    testImplementation platform('org.spockframework:spock-bom:2.4-groovy-5.0')
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    // the framework declares the servlet API compileOnlyApi, and Moqui boots a servlet context in tests
    testImplementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
}

// by default the Java plugin runs test on build, change to not do that (only run test if explicit task)
check.dependsOn.clear()

test {
    useJUnitPlatform()
    testLogging { events "passed", "skipped", "failed"; showExceptions = true; exceptionFormat = 'full' }
    maxParallelForks 1
    systemProperty 'moqui.runtime', runtimeDir.absolutePath
    systemProperty 'moqui.conf', 'conf/MoquiDevConf.xml'
    systemProperty 'moqui.init.static', 'true'
    // the tests run each pass by hand (ScriptDeploymentScheduler.runDue), so the timed scheduler stays off
    systemProperty 'script_deployment_check_seconds', '0'
    // an in-memory Bitronix journal, so a test JVM never touches runtime/txlog
    systemProperty 'bitronix.tm.journal', 'null'
    systemProperty 'bitronix.tm.serverId', 'moqui-jexl-test'
    classpath += files(sourceSets.main.output.classesDirs)
    classpath += files(projectDir.absolutePath)
}

task cleanLib(type: Delete) { delete fileTree(dir: projectDir.absolutePath+'/lib', include: '*') }
clean.dependsOn cleanLib

jar {
    destinationDirectory = file(projectDir.absolutePath + '/lib')
    archiveBaseName = jarBaseName
}
tasks.register('copyDependencies', Copy) {
    dependsOn cleanLib
    from (configurations.runtimeClasspath -
          project(':framework').configurations.runtimeClasspath -
          project(':framework').tasks.named('jar').get().archiveFile.get().asFile)
    into file(projectDir.absolutePath + '/lib')
}
jar.dependsOn copyDependencies
